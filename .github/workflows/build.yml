name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15   # Xcode 16.2 is available on macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show SDKs
        run: xcodebuild -showsdks

      - name: Build for iOS
        run: |
          xcodebuild \
            -project RTSPCam.xcodeproj \
            -scheme RTSPCam \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos \
            clean build

      - name: Package IPA
        run: |
          cd build/Release-iphoneos
          mkdir -p Payload
          cp -r RTSPCam.app Payload/RTSPCam.app
          # Inject required bundle keys that xcodebuild strips when signing is disabled
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.user.RTSPCam" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.user.RTSPCam" Payload/RTSPCam.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string RTSPCam" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable RTSPCam" Payload/RTSPCam.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string RTSPCam" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleName RTSPCam" Payload/RTSPCam.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string RTSPCam" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName RTSPCam" Payload/RTSPCam.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" Payload/RTSPCam.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" Payload/RTSPCam.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" Payload/RTSPCam.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" Payload/RTSPCam.app/Info.plist
          zip -r ../../RTSPCam.ipa Payload
          cd ../..
          echo "IPA size: $(du -sh RTSPCam.ipa | cut -f1)"
          unzip -l RTSPCam.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTSPCam-IPA
          path: RTSPCam.ipa
          retention-days: 30
